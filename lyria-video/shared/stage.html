<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Deterministic stage for the FULL song. Same contract as fragment-test-01-drop/shared/stage.html:
// a scene sets window.SCENE = { init?(api), draw(ctx, S, api) }; draw is a pure function of S
// (absolute song seconds). Frames are rendered out of order, so randomness must come from api.rng / api.hash.
(async function () {
  const params = new URLSearchParams(location.search);
  const style = params.get('style'), folder = params.get('folder');
  const timing = await (await fetch('/timing.json')).json();

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, k) => a + (b - a) * k;
  const seg = (S, a, b) => clamp((S - a) / (b - a));
  const ease = {
    smooth: k => k * k * (3 - 2 * k),
    in: k => k * k * k,
    out: k => 1 - Math.pow(1 - k, 3),
    inOut: k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
    expOut: k => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k)),
    back: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
    elastic: k => (k <= 0 ? 0 : k >= 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (2 * Math.PI / 3)) + 1)
  };
  const hash = i => { let h = (i | 0) * 2654435761 >>> 0; h ^= h >>> 15; h = Math.imul(h, 2246822519) >>> 0; h ^= h >>> 13; return (h >>> 0) / 4294967296; };
  const rng = seed => { let a = (seed | 0) + 0x6D2B79F5; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };

  const api = {
    W: 1920, H: 1080, style, timing,
    t0: timing.t0, t1: timing.t1, cues: timing.cues, lines: timing.lines,
    beatSec: timing.beatSec, anchor: timing.anchor,
    clamp, lerp, seg, ease, hash, rng,
    beat: S => (S - timing.anchor) / timing.beatSec,
    pulse: (S, k = 5) => { const b = (S - timing.anchor) / timing.beatSec; const f = b - Math.floor(b); return Math.exp(-f * k); },
    wordProgress: (w, S) => clamp((S - w.s) / Math.max(0.05, w.e - w.s)),
    lineAt: S => timing.lines.find(l => S >= l.words[0].s - 0.35 && S <= l.words[l.words.length - 1].e + 0.5) || null,
    count: S => {
      const c = timing.cues, k = clamp((S - c.countFrom) / (c.countTo - c.countFrom));
      if (S < c.countFrom) return 0;
      return Math.round(Math.pow(c.countValue, ease.smooth(k) * 0.9 + 0.1 * k));
    }
  };
  window.__api = api;

  const load = src => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = `${src}?v=${Date.now()}`;
    s.onload = res; s.onerror = () => rej(new Error('cannot load ' + src));
    document.head.appendChild(s);
  });
  await load('/shared/shot-scene.js');
  await load(`/${folder}/scene.js`);
  const scene = window.SCENE;
  if (scene.init) await scene.init(api);

  // willReadFrequently pins the canvas to software raster. Without it Chrome moves the canvas between GPU and
  // software after a few seconds of screenshots, which shifts anti-aliasing on a few pixels and breaks frame hashes.
  const ctx = document.getElementById('c').getContext('2d', { willReadFrequently: true });
  window.__frame = S => {
    // Shots leave lineCap/font/etc. behind; without a reset a frame would depend on the previous one.
    ctx.reset();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, 1920, 1080);
    ctx.save();
    scene.draw(ctx, S, api);
    ctx.restore();
  };
  window.__shots = (window.__shotList || []);
  // First use of a system font or glyph can paint with a fallback while it loads; draw every shot once
  // (and the fragment window) so no rendered frame is the first to touch a font.
  const FONTS = ['700 40px "Avenir Next Condensed"', '600 40px "Marker Felt"', '40px "Chalkboard SE"', '40px "Bradley Hand"', '40px "Comic Sans MS"', '700 40px "Arial Black"', '700 40px Menlo', '40px Menlo'];
  await Promise.all(FONTS.map(f => document.fonts.load(f, 'GOHOLD0123456789 abcxyz').catch(() => null)));
  for (const s of window.__shots) for (const k of [0.1, 0.5, 0.9]) { window.__frame(s.t0 + (s.t1 - s.t0) * k); await new Promise(r => setTimeout(r, 0)); }
  for (let S = timing.fragment ? timing.fragment.t0 : 0; timing.fragment && S < timing.fragment.t1; S += 0.25) window.__frame(S);
  await document.fonts.ready;
  await new Promise(r => setTimeout(r, 1000));
  window.__ready = true;
})();
</script>
</body>
</html>
